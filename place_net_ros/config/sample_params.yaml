place_net_server:
  ros__parameters:
    # Absolute path to your trained model. Must have the associated config.yaml file in the same directory
    checkpoint_path: /place_net_model.pt
    # Absolute path to your inverse reachability map .pt file
    inverse_reachability_map_path: /place_net_irm.pt
    # Numerical index of the CUDA device to load the model onto. Omitting this will result in the model loading
    # to the same device that was used for training
    device: 0
    # Maxmimum number of forward passes to execute in parallel. Reduce this for devices with limited VRAM
    max_batch_size: 4
    # Maximum number of IK problems to solve in parallel for ground truth queries. Reduce this for devices with limited VRAM
    max_ik_count: 2000
    # The ROS world static frame ID. Query responses and visualizations will be defined in this frame
    world_frame: map
    # Whether or not to visualize results. Visualizations are useful for debugging but can take a while to compute
    # and render, and so disabling this option may be desired for deployment scenarios
    visualize: True
